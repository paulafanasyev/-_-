name: one-shot RU test fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact localized fixes and remove this workflow
        shell: python
        run: |
          from pathlib import Path

          def replace_all(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count == 0:
                  raise SystemExit(f'missing expected text: {path}: {old!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} occurrence(s)')

          replace_all(
              'src/voice/gevRealtime.js',
              'Release Space to send',
              'Отпустите пробел для отправки',
          )
          replace_all(
              'src/voice/gevRealtime.js',
              'Hold Space to talk',
              'Удерживайте пробел для речи',
          )
          replace_all(
              'src/data/militaryAwareness.test.mjs',
              'AIS vessels',
              'Суда AIS',
          )

          workflow = Path('.github/workflows/one-shot-fix-ru.yml')
          workflow.unlink()
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/voice/gevRealtime.js src/data/militaryAwareness.test.mjs .github/workflows/one-shot-fix-ru.yml
          git commit -m 'fix: complete remaining Russian test strings'
          git push origin HEAD:main
