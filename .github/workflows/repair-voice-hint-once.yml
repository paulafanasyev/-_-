name: repair voice hint once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: localize push-to-talk hint') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch and remove one-shot workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/voice/gevRealtime.js')
          text = path.read_text(encoding='utf-8')
          old = "? 'Release Space to send'"
          new = "? 'Отпустите пробел для отправки'"
          if old not in text:
              raise SystemExit(f'expected voice hint expression not found: {old!r}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/repair-voice-hint-once.yml').unlink()
      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/voice/gevRealtime.js .github/workflows/repair-voice-hint-once.yml
          git commit -m 'fix: localize push-to-talk hint'
          git push origin HEAD:main
