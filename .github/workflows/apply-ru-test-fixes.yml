name: GEV full test suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gev-full-test-suite-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Repair localized push-to-talk hint
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/voice/gevRealtime.js')
          text = path.read_text(encoding='utf-8')
          old = "? 'Release Space to send'\\n    : 'Удерживайте пробел для речи · нажмите микрофон для переключения';"
          new = "? 'Отпустите пробел для отправки'\\n    : 'Удерживайте пробел для речи · нажмите микрофон для переключения';"
          if old not in text:
              raise SystemExit('expected resolveVoiceControlHint expression not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('patched resolveVoiceControlHint')

      - name: Commit localized hint if needed
        shell: bash
        run: |
          if git diff --quiet -- src/voice/gevRealtime.js; then
            echo 'No source repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/voice/gevRealtime.js
          git commit -m 'fix: localize push-to-talk hint'
          git push origin HEAD:main

      - name: Run full unit suite
        id: tests
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          {
            echo "## GEV full test suite"
            echo
            echo "Exit code: $status"
            echo
            echo "### Failing tests"
            if grep '^not ok ' test-output.log; then :; else echo 'None'; fi
            echo
            echo "### Failure details"
            awk '/^not ok / {show=1; n=0} show {print; n++} show && n>=30 {show=0}' test-output.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload test output on failure
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: gev-test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail when tests fail
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        run: exit 1
