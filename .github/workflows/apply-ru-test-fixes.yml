name: GEV full test suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a full-suite run when another run starts. We need a complete,
# independently observable PASS/FAIL result rather than a concurrency-induced
# cancellation in the middle of `npm test`.
concurrency:
  group: gev-full-test-suite-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full unit suite
        id: tests
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          {
            echo "## GEV full test suite"
            echo
            echo "Exit code: $status"
            echo
            echo "### Failing tests"
            if grep '^not ok ' test-output.log; then :; else echo 'None'; fi
            echo
            echo "### Failure details"
            awk '/^not ok / {show=1; n=0} show {print; n++} show && n>=30 {show=0}' test-output.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload test output on failure
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: gev-test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail when tests fail
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        run: exit 1
