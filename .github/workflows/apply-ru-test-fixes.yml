name: Apply RU test expectation fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply verified localization expectation fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_one(path, variants, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old in variants:
                  if old in s:
                      p.write_text(s.replace(old, new), encoding='utf-8')
                      print(f'patched {path}: {old!r}')
                      return
              raise SystemExit(f'no known variant found: {path}: {variants!r}')

          replace_one(
              'src/cockpitMarkup.test.mjs',
              ["assert.match(body, /'BRG —'/);", "assert.match(body, /'АЗИМУТ —'/);"] ,
              "assert.match(body, /'АЗИМУТ —'/);",
          )
          replace_one(
              'src/data/aisStreamAdapter.test.mjs',
              ["assert.match(adapter.snapshot().error, /ws emitter semantics/);"],
              "assert.match(adapter.snapshot().error, /ws emitter semantics|интерфейс событий WebSocket/);",
          )
          replace_one(
              'src/data/layerState.test.mjs',
              ["label: 'military flight',"],
              "label: 'военный полёт',",
          )
          replace_one(
              'src/data/militaryAwareness.test.mjs',
              [
                  r'/Mapped installations<\\/strong><b aria-live="polite">\\?<\\/b>/',
                  r'/Mapped installations<\\/strong><b aria-live="polite">\?<\\/b>/',
                  r'/Mapped installations<\\/strong><b aria-live="polite">\?<\\/b>/',
              ],
              r'/Нанесённые на карту объекты<\\/strong><b aria-live="polite">\?<\\/b>/',
          )
          replace_one(
              'src/data/militaryAwareness.test.mjs',
              [
                  r'/AIS vessels<\\/strong><b aria-live="polite">\\?<\\/b>/',
                  r'/AIS vessels<\\/strong><b aria-live="polite">\?<\\/b>/',
              ],
              r'/Суда AIS<\\/strong><b aria-live="polite">\?<\\/b>/',
          )
          replace_one(
              'src/data/militaryAwareness.test.mjs',
              [
                  r'/AIS vessels<\\/strong><b aria-live="polite">0<\\/b>/',
                  r'/AIS vessels<\\/strong><b aria-live="polite">0<\\/b>/',
              ],
              r'/Суда AIS<\\/strong><b aria-live="polite">0<\\/b>/',
          )
          replace_one(
              'src/data/rocketLaunches.test.mjs',
              ["      'STAGE RE-ENTRY',\n      'EST. ORBIT POSITION',"],
              "      'ЭТАП · ВХОД В АТМОСФЕРУ',\n      'EST. ORBIT POSITION',",
          )
          replace_one(
              'src/overlays/worldOverlay.test.mjs',
              ['Focusing Focus vessel TEST, MMSI 123'],
              'Фокус на Focus vessel TEST, MMSI 123',
          )
          replace_one(
              'src/voice/gevRealtime.test.mjs',
              ['Hold Space to speak · click mic to toggle voice'],
              'Удерживайте пробел для речи · нажмите микрофон для переключения голоса',
          )
          replace_one(
              'src/voice/gevRealtime.test.mjs',
              ['Release Space to send'],
              'Отпустите пробел для отправки',
          )

      - name: Run full unit suite
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows/apply-ru-test-fixes.yml
          git rm .github/workflows/apply-ru-test-fixes.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m 'fix: align tests with Russian UI labels'
          git push
