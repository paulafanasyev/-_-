name: Repair rocket export identifiers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Repair accidental Cyrillic public identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/data/rocketLaunches.js')
          s = p.read_text()
          replacements = {
            'ROCKET_МИССИЯ_AMBIENT_OVERLAY_SOURCE_ID': 'ROCKET_MISSION_AMBIENT_OVERLAY_SOURCE_ID',
            'ROCKET_МИССИЯ_SELECTED_OVERLAY_SOURCE_ID': 'ROCKET_MISSION_SELECTED_OVERLAY_SOURCE_ID',
            'ROCKET_МИССИЯ_AMBIENT_OVERLAY_COHORT_LIMIT': 'ROCKET_MISSION_AMBIENT_OVERLAY_COHORT_LIMIT',
            'ROCKET_МИССИЯ_AMBIENT_OVERLAY_COLLISION_CAPACITY': 'ROCKET_MISSION_AMBIENT_OVERLAY_COLLISION_CAPACITY',
            'ROCKET_МИССИЯ_SELECTED_OVERLAY_SOURCE_OPTIONS': 'ROCKET_MISSION_SELECTED_OVERLAY_SOURCE_OPTIONS',
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/rocketLaunches.js
          if git diff --cached --quiet; then
            echo 'No rocket identifier repair needed.'
            exit 0
          fi
          git commit -m 'fix: restore rocket mission public identifiers'
          git push origin HEAD:main
